components:
  parameters:
    idParam:
      name: id
      in: path
      description: ID numérico do registro
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    Genero:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          example: "Corrida"

    Cargo:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          example: "Ilustrador"
        descricao:
          type: string
          example: "Responsável por ilustrações"

    Filme:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          example: "Frankenstein"
        sinopse:
          type: string
          example: "O Dr. Victor Frankenstein..."
        data_lancamento:
          type: string
          format: date
          example: "2025-10-17"
        duracao:
          type: string
          example: "02:29:00"
        orcamento:
          type: number
          format: double
          example: 120000000.00
        trailer:
          type: string
        capa:
          type: string
        genero:
          type: array
          description: Lista de IDs de gêneros
          items:
            type: object
            properties:
              id:
                type: integer

    Profissional:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          example: "Andrei Tarkovski"
        nacionalidade:
          type: string
          example: "Russia"
        biografia:
          type: string

    Distribuidora:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          example: "A24 Films"
        site:
          type: string
          example: "https://a24films.com"

    FilmeGenero:
      type: object
      description: Tabela associativa
      properties:
        id:
          type: integer
        id_filme:
          type: integer
        id_genero:
          type: integer

    Classificacao:
      type: object
      properties:
        id:
          type: integer
        nivel:
          type: string
          example: "18"
        descricao:
          type: string
          example: "Violência"

    Personagem:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          example: "Hulk"
        descricao:
          type: string
          example: "Cientista Bruce Banner..."

    Ator:
      type: object
      properties:
        id:
          type: integer
        profissional_id:
          type: integer
        personagem_id:
          type: integer

    PersonagemFilme:
      type: object
      description: Associação entre Personagem e Filme
      properties:
        id:
          type: integer
        personagem_id:
          type: integer
        filme_id:
          type: integer