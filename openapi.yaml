openapi: 3.0.3
info:
  title: Projeto Locadora de Filmes
  description: API destinada ao controle de uma locadora de filmes (Filmes, Atores, Gêneros, etc).
  termsOfService: http://swagger.io/terms/
  contact:
    email: suporte@locadora.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Saiba mais sobre o Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:8080/v1/locadora
paths:
  # --- GENERO ---
  /genero:
    get:
      tags: [Genero]
      summary: Lista todos os gêneros
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Genero'
    post:
      tags: [Genero]
      summary: Cria um novo gênero
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Genero'
      responses:
        '201':
          description: Criado com sucesso
  /genero/{id}:
    get:
      tags: [Genero]
      summary: Busca gênero por ID
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genero'
    put:
      tags: [Genero]
      summary: Atualiza gênero
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Genero'
      responses:
        '200':
          description: Atualizado com sucesso
    delete:
      tags: [Genero]
      summary: Deleta gênero
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Deletado com sucesso

